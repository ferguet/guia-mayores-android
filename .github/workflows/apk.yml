# Compila el APK y lo publica en un enlace FIJO.
#
# Antes habia que: entrar en Actions, abrir la compilacion, bajar hasta
# Artifacts, descargar un zip, descomprimirlo, pasar el apk al movil e
# instalarlo. Demasiados pasos para cada cambio.
#
# Ahora se publica en una "release" con la etiqueta "ultima", que se
# sobrescribe en cada compilacion. Asi el enlace de descarga es SIEMPRE
# EL MISMO: se guarda en favoritos del movil, se toca, y se instala.
# Ni ordenador, ni zip, ni cables.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # hace falta para publicar la release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      # Nombre fijo del fichero: asi el enlace de descarga no cambia nunca
      - name: Renombrar
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/*.apk salida/guia-mayores.apk

      - name: Publicar en el enlace fijo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ultima \
            --title "Ultima version" \
            --notes "Se actualiza sola en cada cambio. Toque el fichero .apk para instalar." \
            || echo "la release ya existia, solo se actualiza el fichero"
          gh release upload ultima salida/guia-mayores.apk --clobber

      # Se deja tambien como artifact, por si algun dia hace falta
      - name: Guardar copia
        uses: actions/upload-artifact@v4
        with:
          name: guia-mayores-apk
          path: salida/guia-mayores.apk
          if-no-files-found: error
