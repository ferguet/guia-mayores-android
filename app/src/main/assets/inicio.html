<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inicio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>
  /* Pantalla de arranque. Todo enorme y con muy pocas opciones: cuantas
     mas cosas hay en la pantalla, mas se bloquean. */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; min-height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    background:#eef1f4; color:#141414; padding:22px 18px 40px;
  }
  h1{font-size:27px; line-height:1.25; margin:8px 0 4px;}
  .sub{font-size:17px; color:#5f5f5f; margin-bottom:26px; line-height:1.4;}
  .op{
    display:block; width:100%; text-align:left; margin-bottom:16px;
    padding:22px 20px; border:none; border-radius:18px; cursor:pointer;
    background:#0b7a3b; color:#fff; box-shadow:0 5px 0 #065c2c;
  }
  .op.azul{background:#0a5fa8; box-shadow:0 5px 0 #083f70;}
  .op:active{transform:translateY(4px); box-shadow:0 1px 0 #065c2c;}
  .op b{font-size:23px; display:block; line-height:1.25;}
  .op span{font-size:16px; opacity:.93; display:block; margin-top:5px; line-height:1.35;}
  .otra{margin-top:34px; padding-top:22px; border-top:2px solid #d6dbe1;}
  .otra p{font-size:14.5px; color:#5f5f5f; margin:0 0 10px;}
  .fila{display:flex; gap:9px;}
  .fila input{
    flex:1; padding:14px; font-size:17px; border:2px solid #c3c9d0;
    border-radius:11px; background:#fff; min-width:0;
  }
  .fila button{
    flex-shrink:0; padding:14px 20px; font-size:17px; font-weight:700;
    border:none; border-radius:11px; background:#5f5f5f; color:#fff;
  }
</style>
</head>
<body>

<h1>¿Qué quiere hacer?</h1>
<div class="sub">Yo le voy acompañando y le aviso si algo intenta engañarle.</div>

<button class="op" onclick="abrir('https://www.citapreviadnie.es/')">
  <b>🪪 Pedir cita para el DNI</b>
  <span>Le guío casilla por casilla</span>
</button>

<button class="op azul" onclick="abrir('https://www.amazon.es/')">
  <b>🛒 Comprar por internet</b>
  <span>Le aviso de cobros escondidos y casillas marcadas</span>
</button>

<div class="otra">
  <p>O escriba qué busca, con sus palabras:</p>
  <div class="fila">
    <input id="dir" type="text" placeholder="la seat, el ayuntamiento..." autocomplete="off">
    <button onclick="irADireccion()">Buscar</button>
  </div>
</div>

<script>
function abrir(u){ location.href = u; }

/* Antes esto era una casilla de direcciones y fallaba constantemente:
   habia que escribir "www.loquesea.es" sin equivocarse en un solo
   caracter, y cualquier fallo dejaba la pantalla en blanco. Nadie
   escribe direcciones asi, y menos con un teclado pequeño.

   Ahora funciona como buscador: si lo escrito parece una direccion de
   verdad se va derecho ahi; si no, se busca. Asi vale poner "la seat"
   o "ayuntamiento de mi pueblo" y funciona igual.

   Se busca en DuckDuckGo a proposito: no monta muro de cookies ni pide
   aceptar nada, que es justo de lo que estamos protegiendo. */
function irADireccion(){
  var v = document.getElementById('dir').value.trim();
  if(!v) return;
  var esDireccion = /^[^\s]+\.[a-z]{2,}(\/|$)/i.test(v);
  if(esDireccion){
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    location.href = v;
  } else {
    location.href = 'https://duckduckgo.com/?kl=es-es&q=' + encodeURIComponent(v);
  }
}
document.getElementById('dir').addEventListener('keydown', function(e){
  if(e.key === 'Enter') irADireccion();
});
</script>
</body>
</html>
